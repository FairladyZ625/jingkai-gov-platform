name: 演示 HTTP 联调
on: pull_request
permissions:
  contents: read
jobs:
  demo-http:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs --durations=12 tests/demo_http tests/jkq/test_demo_stability.py
