name: 仓库检查
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_body.py

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 防泄密检查
        run: |
          if test -f scripts/guard.py; then
            python3 scripts/guard.py
          else
            echo "::notice::等待 #2 提供 scripts/guard.py，本次跳过"
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q --ignore=tests/demo

  document-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q apps/document/tests/test_review_export.py

  demo:
    # Playwright 1.58 不支持 ubuntu-latest（26.04）上的 chromium，固定 24.04。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Web 冒烟和 12 段演示
        run: |
          npm --prefix web ci
          (cd web && npx --no-install playwright install --with-deps chromium)
          npm --prefix web run test:smoke
          npm --prefix web run test:smoke:mock
          npm --prefix web run test:e2e
          node --test tests/data/real-supplement.test.cjs
      - name: 前端冒烟
        run: |
          if test -d tests/demo; then
            cd tests/demo
            npm ci
            npx --no-install playwright install --with-deps chromium
            npm test
          else
            echo "::notice::tests/demo 尚未交付，本次跳过"
          fi

  prototype-p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/p0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test

  demo-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查离线脚本与种子一致
        run: |
          python3 web/mock/build_mock.py
          git diff --exit-code -- web/config/mock-data.js
          python3 scripts/check_names.py
      - name: 演示数据契约与离线浏览器
        working-directory: tests/demo-data
        run: |
          npm ci
          npm test
          npx --no-install playwright install --with-deps chromium
          npm run test:browser

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/tests/contract/*.test.cjs
      - run: npm --prefix web run contract
      - name: Chromium 混合会话
        run: |
          npm --prefix web ci
          (cd web && npx --no-install playwright install --with-deps chromium)
          node --test web/tests/contract/browser.cjs web/tests/contract/workbench-browser.cjs web/tests/e2e/document-workbench.cjs
