name: 仓库检查
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_body.py

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 防泄密检查
        run: |
          if test -f scripts/guard.py; then
            python3 scripts/guard.py
          else
            echo "::notice::等待 #2 提供 scripts/guard.py，本次跳过"
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q --ignore=tests/demo

  demo:
    # Playwright 1.58 不支持 ubuntu-latest（26.04）上的 chromium，固定 24.04。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 前端冒烟
        run: |
          if test -d tests/demo; then
            cd tests/demo
            npm ci
            npx --no-install playwright install --with-deps chromium
            npm test
          else
            echo "::notice::tests/demo 尚未交付，本次跳过"
          fi

  prototype-p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/p0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test

  demo-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查离线脚本与种子一致
        run: |
          python3 prototype/v4/mock/build_mock.py
          git diff --exit-code -- prototype/v4/config/mock-data.js
          python3 scripts/check_names.py
      - name: 演示数据契约与离线浏览器
        working-directory: tests/demo-data
        run: |
          npm ci
          npm test
          npx --no-install playwright install --with-deps chromium
          npm run test:browser

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/tests/contract/*.test.cjs
      - run: npm --prefix web run contract
      - name: Chromium 混合会话
        run: |
          if test -f web/index.html; then
            contract_web="$PWD/web"
          else
            # #4 合入前，使用固定的 Web 迁移提交跑实际登录入口。
            git fetch --depth=1 origin 956437fa7a879d981118b4a21e97e6ce88aabbbd
            contract_root="$(mktemp -d)"
            trap 'rm -rf "$contract_root"' EXIT
            git archive FETCH_HEAD web | tar -x -C "$contract_root"
            contract_web="$contract_root/web"
            cp web/api/http.js "$contract_web/api/http.js"
            cp web/config/app.config.js "$contract_web/config/app.config.js"
            mkdir -p "$contract_web/tests/contract"
            cp web/tests/contract/browser.cjs "$contract_web/tests/contract/"
          fi
          npm --prefix "$contract_web" ci
          cd "$contract_web"
          npx --no-install playwright install --with-deps chromium
          node --test tests/contract/browser.cjs
