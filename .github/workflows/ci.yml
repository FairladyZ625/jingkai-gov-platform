name: 仓库检查
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_body.py

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 防泄密检查
        run: |
          if test -f scripts/guard.py; then
            python3 scripts/guard.py
          else
            echo "::notice::等待 #2 提供 scripts/guard.py，本次跳过"
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q --ignore=tests/demo

  demo:
    # Playwright 1.58 不支持 ubuntu-latest（26.04）上的 chromium，固定 24.04。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Web 冒烟和 12 段演示
        run: |
          npm --prefix web ci
          (cd web && npx --no-install playwright install --with-deps chromium)
          npm --prefix web run test:smoke
          npm --prefix web run test:e2e
          node --test tests/data/real-supplement.test.cjs
      - name: 离线演示回归
        if: ${{ hashFiles('tests/demo/package-lock.json') != '' }}
        run: |
          cd tests/demo
          npm ci
          npx --no-install playwright install --with-deps chromium
          npm test
