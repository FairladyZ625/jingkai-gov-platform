name: 仓库检查
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_body.py

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 防泄密检查
        run: |
          if test -f scripts/guard.py; then
            python3 scripts/guard.py
          else
            echo "::notice::等待 #2 提供 scripts/guard.py，本次跳过"
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q --ignore=tests/demo

  document-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q apps/document/tests/test_review_export.py

  demo:
    # Playwright 1.58 不支持 ubuntu-latest（26.04）上的 chromium，固定 24.04。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 前端冒烟
        run: |
          if test -d tests/demo; then
            cd tests/demo
            npm ci
            npx --no-install playwright install --with-deps chromium
            npm test
          else
            echo "::notice::tests/demo 尚未交付，本次跳过"
          fi

  prototype-p0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/p0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
