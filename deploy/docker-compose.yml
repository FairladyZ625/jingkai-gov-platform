name: jkq-demo
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: jkq-demo-app:${DEMO_TAG:-local}
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file: .env
    environment:
      HAIKNOW_ROOT: /srv/app
      HAIKNOW_APPS_DIR: /srv/app/apps
      HAIKNOW_DATA_DIR: /state/live
      HAIKNOW_CONFIG_DIR: /srv/app/config
    command: ["python", "-m", "uvicorn", "jkq.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "${APP_PORT:-8000}", "--workers", "1"]
    volumes:
      - ${DEMO_STATE_DIR:-/var/lib/jkq-demo}/data:/state/live
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',${APP_PORT:-8000},timeout=3); c.request('GET','/api/health'); sys.exit(c.getresponse().status != 200)"]
      interval: 5s
      timeout: 4s
      retries: 12
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?请配置演示域名}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  certificates:
  caddy_config:
