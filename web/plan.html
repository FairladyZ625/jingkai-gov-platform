<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发计划 · 经开区共享智能体工作站</title>
<link rel="icon" href="assets/favicon.png">
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('jk4-theme2') || 'light'; } catch (e) {}
  try { if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) document.documentElement.dataset.mac = '1'; } catch (e) {}
</script>
<link rel="stylesheet" href="assets/theme.css">
<!-- 计划数据：scripts/gen-plan-data.sh 生成；在线时页面会再从 GitHub 公开接口刷新状态 -->
<script src="plan-data.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font);font-size:var(--fs-md);line-height:var(--lh);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12px}
.top{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .brand{font-weight:var(--fw-m);color:var(--text)}
.top .brand em{font-style:normal;color:var(--text-3);margin-left:6px;font-weight:var(--fw-n)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--ctl-h-sm);padding:0 10px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:var(--fs-sm);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn[disabled]{opacity:.55;cursor:default}
.wrap{width:min(1200px,100%);margin:0 auto;padding:32px 24px 80px}
.kicker{font-size:var(--fs-xs);color:var(--text-3);letter-spacing:.04em;margin:0 0 6px}
h1{font-size:var(--fs-2xl);letter-spacing:var(--track-display);font-weight:var(--fw-m);margin:0 0 6px;line-height:var(--lh-tight)}
.sub{color:var(--text-2);margin:0 0 24px;max-width:52em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;font-weight:var(--fw-m);letter-spacing:var(--track-tight);line-height:1.2}
.kpi span{font-size:var(--fs-xs);color:var(--text-2);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--t-gray-fg)}
.d-done{background:var(--ok)}.d-review{background:var(--t-violet-fg)}.d-doing{background:var(--accent)}.d-ready{background:var(--warn)}.d-blocked{background:var(--t-gray-fg)}.d-unknown{background:var(--border-hover)}
.prog{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .p-done{background:var(--ok)}.prog .p-review{background:var(--t-violet-fg)}.prog .p-doing{background:var(--accent)}
.overall{padding:16px 18px;margin-bottom:12px}
.overall .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.overall .row b{font-weight:var(--fw-m)}
.overall .meta{font-size:var(--fs-xs);color:var(--text-3)}
.mss{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.ms{padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color var(--dur) var(--ease)}
.ms:hover{border-color:var(--border-hover)}
.ms.on{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.ms .k{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ms .t{font-weight:var(--fw-m);margin:2px 0 8px;font-size:var(--fs-sm);line-height:1.4;min-height:2.8em}
.ms .n{font-size:var(--fs-xs);color:var(--text-2);margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;position:sticky;top:var(--top-h);z-index:10;background:var(--canvas);padding:10px 0;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;font:inherit;font-size:var(--fs-sm);padding:0 10px;height:28px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--active);color:var(--text)}
select,input[type=search]{height:30px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font:inherit;font-size:var(--fs-sm);padding:0 8px}
input[type=search]{width:200px}
.bar .cnt{margin-left:auto;font-size:var(--fs-xs);color:var(--text-3)}
.grp{margin:28px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp h2{font-size:var(--fs-lg);font-weight:var(--fw-m);margin:0}
.grp .k{font-family:var(--mono);color:var(--accent);font-size:13px}
.grp p{margin:0;color:var(--text-2);font-size:var(--fs-sm);flex-basis:100%}
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.task{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.task .h{display:flex;gap:8px;align-items:flex-start}
.task .h .ttl{flex:1;font-weight:var(--fw-m);line-height:1.45}
.task .h .ttl .tid{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-right:6px;font-weight:var(--fw-n)}
.st{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11px;height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface);white-space:nowrap}
.goal{color:var(--text-2);font-size:var(--fs-sm);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:11px;height:20px;line-height:18px;padding:0 7px;border-radius:var(--r-sm);border:1px solid var(--t-gray-bd);background:var(--t-gray-bg);color:var(--text-2);white-space:nowrap}
.tg.blue{border-color:var(--t-blue-bd);background:var(--t-blue-bg);color:var(--t-blue-fg)}
.tg.red{border-color:var(--t-red-bd);background:var(--t-red-bg);color:var(--t-red-fg)}
.tg.amber{border-color:var(--t-amber-bd);background:var(--t-amber-bg);color:var(--t-amber-fg)}
.tg.green{border-color:var(--t-green-bd);background:var(--t-green-bg);color:var(--t-green-fg)}
.tg.violet{border-color:var(--t-violet-bd);background:var(--t-violet-bg);color:var(--t-violet-fg)}
.tg.teal{border-color:var(--t-teal-bd);background:var(--t-teal-bg);color:var(--t-teal-fg)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-xs);color:var(--text-3);align-items:center}
.meta .deps a{margin-right:6px;display:inline-flex;align-items:center;gap:4px}
details{border-top:1px solid var(--border);padding-top:8px}
details+details{padding-top:6px}
summary{cursor:pointer;font-size:var(--fs-xs);color:var(--text-2);list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:4px solid var(--text-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform var(--dur) var(--ease)}
details[open] summary::before{transform:rotate(90deg)}
ul.acc{margin:8px 0 2px;padding:0;list-style:none}
ul.acc li{display:flex;gap:8px;font-size:var(--fs-sm);color:var(--text);padding:3px 0}
ul.acc li::before{content:"";flex:none;width:12px;height:12px;margin-top:5px;border:1.5px solid var(--border-hover);border-radius:3px}
.task.s-done ul.acc li::before{background:var(--ok);border-color:var(--ok)}
.reuse{margin:8px 0 2px;display:grid;gap:6px}
.reuse div{font-size:var(--fs-sm);display:grid;grid-template-columns:56px 1fr;gap:8px}
.reuse .md{font-size:11px;text-align:center;height:20px;line-height:18px;border-radius:var(--r-sm);border:1px solid var(--border-strong);color:var(--text-2)}
.reuse .md.m-direct{border-color:var(--t-green-bd);background:var(--t-green-bg);color:var(--t-green-fg)}
.reuse .md.m-adapt{border-color:var(--t-blue-bd);background:var(--t-blue-bg);color:var(--t-blue-fg)}
.reuse .md.m-ref{border-color:var(--t-amber-bd);background:var(--t-amber-bg);color:var(--t-amber-fg)}
.reuse code{background:var(--fill);padding:1px 5px;border-radius:4px;word-break:break-all}
.reuse small{display:block;color:var(--text-2);font-size:12px}
.prs{display:flex;flex-wrap:wrap;gap:6px;font-size:var(--fs-xs)}
.empty{padding:40px;text-align:center;color:var(--text-3)}
.foot{margin-top:40px;font-size:var(--fs-xs);color:var(--text-3)}
.toast{font-size:var(--fs-xs);color:var(--text-3)}
.live{padding:16px 18px;margin-bottom:12px}
.live .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.live .row b{font-weight:var(--fw-m)}
.live .meta{font-size:var(--fs-xs);color:var(--text-3)}
.live .cap{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:var(--fs-sm);color:var(--text-2)}
.live .cap .prog{flex:1;max-width:320px}
.live .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.live h3{font-size:var(--fs-sm);font-weight:var(--fw-m);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.live h3 small{font-weight:var(--fw-n);color:var(--text-3)}
.live ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.live li{font-size:var(--fs-sm);line-height:1.45;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--canvas)}
.live li .l1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.live li .l2{font-size:var(--fs-xs);color:var(--text-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.live .none{font-size:var(--fs-sm);color:var(--text-3);padding:6px 0}
.ph{font-size:11px;height:18px;line-height:16px;padding:0 6px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap}
.ph.p-run{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.ph.p-rev{border-color:var(--t-violet-bd);color:var(--t-violet-fg);background:var(--t-violet-bg)}
.ph.p-back,.ph.p-stuck{border-color:var(--t-red-bd);color:var(--t-red-fg);background:var(--t-red-bg)}
.ph.p-done{border-color:var(--t-green-bd);color:var(--t-green-fg);background:var(--t-green-bg)}
.who{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text)}
.who i{font-style:normal;font-size:10px;padding:0 5px;border-radius:var(--r-sm);border:1px solid var(--border-strong);color:var(--text-2)}
.who i.k-codex{border-color:var(--t-teal-bd);background:var(--t-teal-bg);color:var(--t-teal-fg)}
.who i.k-ceo{border-color:var(--t-amber-bd);background:var(--t-amber-bg);color:var(--t-amber-fg)}
.who i.k-human{border-color:var(--t-blue-bd);background:var(--t-blue-bg);color:var(--t-blue-fg)}
.task .run{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:var(--fs-xs);color:var(--text-2);padding:6px 8px;border-radius:var(--r-md);background:var(--fill)}
.task.stuck{border-color:var(--t-red-bd)}
.ci{display:inline-flex;align-items:center;gap:4px}
.d-fail{background:var(--t-red-fg)}
@media (max-width:1100px){.live .cols{grid-template-columns:1fr}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.mss{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.tasks{grid-template-columns:1fr}.mss{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}input[type=search]{width:100%}.bar{position:static}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">经开智能体工作站 <em>开发计划</em></a>
  <div class="sp"></div>
  <span class="toast" id="src"></span>
  <button class="btn" id="refresh" type="button" title="从 GitHub 公开接口拉取最新 Issue / PR 状态">刷新状态</button>
  <a class="btn" id="gh" href="#" target="_blank" rel="noopener">GitHub</a>
  <a class="btn primary" href="index.html">打开原型</a>
  <button class="btn" id="theme" type="button">深色</button>
</header>
<main class="wrap">
  <p class="kicker">北京经济技术开发区 · 共享智能体工作站 · 从原型到真后端</p>
  <h1>开发计划与任务进度</h1>
  <p class="sub">把原型落成可上线系统：分 5 个里程碑、50 个任务，每个任务对应一个 GitHub Issue，写明验收标准、依赖和卫华平台可复用模块。状态取自 GitHub（任务关闭即视为完成）与 HA 派工记录（谁在做、做到哪一步）。</p>
  <section class="kpis" id="kpis"></section>
  <section class="card overall" id="overall"></section>
  <section class="card live" id="live"></section>
  <section class="mss" id="mss"></section>
  <div class="bar">
    <div class="seg" id="fstate"></div>
    <select id="flabel" aria-label="按标签筛选"></select>
    <select id="fprio" aria-label="按优先级筛选"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option></select>
    <input type="search" id="fq" placeholder="搜索编号、标题、模块…">
    <span class="cnt" id="cnt"></span>
  </div>
  <section id="list"></section>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  var P = window.JK_PLAN || { milestones: [], tasks: [] };
  var REPO = P.repo || 'FairladyZ625/jingkai-gov-platform';
  var GH = 'https://github.com/' + REPO;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var F = { ms: '', state: '', label: '', prio: '', q: '' };
  var ST = { done: '已完成', review: '待合并 PR', doing: '进行中', ready: '可开工', blocked: '等依赖', unknown: '状态未知' };
  var MODE = { '直接用': 'm-direct', '改造': 'm-adapt', '参考': 'm-ref' };
  var LABEL_ZH = { 'type:feat': '功能', 'type:chore': '工程', 'type:bug': '缺陷', 'type:test': '测试', 'reuse:direct': '卫华直接用', 'reuse:adapt': '卫华改造', 'reuse:reference': '卫华参考', 'reuse:none': '新写', 'area:platform': '平台', 'area:ai': 'AI', 'area:web': '前端', 'area:kb': '知识库', 'area:document': '公文', 'area:data': '数据', 'area:enterprise': '企业', 'area:skills': '技能', 'area:computer': '电脑操作', 'area:repo': '仓库', 'area:apps': '应用', 'area:policy': '政策', 'area:meeting': '会议', 'area:deploy': '部署', 'area:qa': '测试联调' };
  var byIssue = {}; P.tasks.forEach(function (t) { byIssue[t.issue] = t; });

  function status(t) {
    if (t.state === 'unknown') return 'unknown';
    if (t.state === 'closed') return 'done';
    if ((t.prs || []).some(function (p) { return p.state === 'OPEN' || p.state === 'open'; })) return 'review';
    if (t.live && (t.live.executors || []).length && t.live.phase !== '完成') return 'doing';
    if ((t.assignees || []).length) return 'doing';
    var ok = (t.depends_on || []).every(function (d) { var x = byIssue[d.issue]; return x && x.state === 'closed'; });
    return ok ? 'ready' : 'blocked';
  }
  function tagCls(l) { return /^priority:P0/.test(l) ? 'red' : /^priority:P1/.test(l) ? 'amber' : /^type:bug/.test(l) ? 'red' : /^reuse:direct/.test(l) ? 'green' : /^reuse:adapt/.test(l) ? 'blue' : /^reuse:ref/.test(l) ? 'amber' : /^area:/.test(l) ? 'violet' : ''; }
  function count(list) { var c = { done: 0, review: 0, doing: 0, ready: 0, blocked: 0, unknown: 0 }; list.forEach(function (t) { c[status(t)]++; }); return c; }
  function progBar(c, n) { return '<div class="prog"><i class="p-done" style="width:' + (c.done / n * 100) + '%"></i><i class="p-review" style="width:' + (c.review / n * 100) + '%"></i><i class="p-doing" style="width:' + (c.doing / n * 100) + '%"></i></div>'; }


  var PHC = { '进行中': 'p-run', '审核中': 'p-rev', '打回': 'p-back', '卡住': 'p-stuck', '完成': 'p-done' };
  var KIND = { codex: 'Codex', ceo: 'CEO', human: '人' };
  function ph(x) { return x ? '<span class="ph ' + (PHC[x] || '') + '">' + esc(x) + '</span>' : ''; }
  function who(e) { var n = String(e.name || '').replace(/^经开区\s*/, ''); return '<span class="who"><i class="k-' + esc(e.kind) + '">' + (KIND[e.kind] || '') + '</i>' + esc(n) + (e.model && n.indexOf('（') < 0 ? ' · ' + esc(e.model) : '') + '</span>'; }
  function ciDot(c) { return '<span class="ci"><i class="dot ' + ({ success: 'd-done', failure: 'd-fail', pending: 'd-ready' }[c] || 'd-unknown') + '"></i>CI ' + ({ success: '通过', failure: '失败', pending: '运行中', none: '未配置' }[c] || '未知') + '</span>'; }
  function renderLive() {
    var H = P.ha || { source: 'none', running: [] }, el = $('live');
    var act = P.tasks.filter(function (t) { return t.live && t.state !== 'closed' && (t.live.executors || []).length; });
    var stuck = act.filter(function (t) { return t.live.stuck; });
    var prs = (P.open_prs || []).filter(function (p) { return !p.draft; });
    var cap = H.worker_cap || 8, run = H.running_workers || 0;
    var h = '<div class="row"><b>实时进度</b><span class="meta">' + (H.source === 'ha' ? 'HA 数据更新于 ' + esc(H.updated_at) : 'HA 数据暂不可用，只显示 GitHub 状态') + '</span></div>';
    h += '<div class="cap"><span>在跑 Codex 会话（含评审、组长） <b>' + run + '</b> / 上限 ' + cap + '</span><div class="prog"><i class="p-doing" style="width:' + Math.min(100, run / cap * 100) + '%"></i></div></div>';
    h += '<div class="cols"><div><h3>进行中的任务 <small>' + act.length + '</small></h3>' + (act.length ? '<ul>' + act.map(function (t) {
      var L = t.live;
      return '<li><div class="l1"><a href="' + GH + '/issues/' + t.issue + '" target="_blank" rel="noopener">#' + t.issue + '</a> <span>' + esc(t.title.replace(/^T\d+\s*/, '')) + '</span> ' + ph(L.stuck ? '卡住' : L.phase) + (L.squad ? ' <span class="ph">小组 ' + esc(L.squad.squad) + '</span>' : '') + '</div>' +
        '<div class="l2">' + L.executors.map(who).join('') + (L.reviewer ? '<span>评审：' + esc(L.reviewer.name.replace(/^经开区\s*/, '')) + '</span>' : '') + (L.started_at ? '<span>开始 ' + esc(L.started_at) + '</span>' : '') + (L.last_activity ? '<span>最近活动 ' + esc(L.last_activity) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="none">暂无</div>');
    var un = (H.unmapped_active || []);
    if (un.length) h += '<h3 style="margin-top:12px">未关联 Issue 的 HA 任务 <small>' + un.length + '</small></h3><ul>' + un.map(function (u) { return '<li><div class="l1"><span>' + esc(u.title) + '</span> ' + ph(u.stuck ? '卡住' : u.phase) + '</div><div class="l2"><span>' + esc(u.executor) + '</span>' + (u.last_activity ? '<span>最近活动 ' + esc(u.last_activity) + '</span>' : '') + '</div></li>'; }).join('') + '</ul>';
    h += '</div><div><h3>待 Ben 合并的 PR <small>' + prs.length + '</small></h3>' + (prs.length ? '<ul>' + prs.map(function (p) {
      return '<li><div class="l1"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">PR #' + p.number + '</a> <span>' + esc(p.title) + '</span></div><div class="l2">' + ciDot(p.ci) + ((p.issues || []).length ? '<span>关联 ' + p.issues.map(function (n) { return '#' + n; }).join(' ') + '</span>' : '') + (p.review === 'APPROVED' ? '<span>已批准</span>' : p.review === 'CHANGES_REQUESTED' ? '<span>要求修改</span>' : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="none">暂无</div>');
    h += '</div><div><h3>卡住的任务 <small>' + stuck.length + '</small></h3>' + (stuck.length ? '<ul>' + stuck.map(function (t) {
      return '<li><div class="l1"><a href="' + GH + '/issues/' + t.issue + '" target="_blank" rel="noopener">#' + t.issue + '</a> <span>' + esc(t.title.replace(/^T\d+\s*/, '')) + '</span></div><div class="l2"><span>' + esc(t.live.stuck_reason) + '</span>' + (t.live.last_activity ? '<span>最近活动 ' + esc(t.live.last_activity) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>' : '<div class="none">没有卡住的任务</div>') + '</div></div>';
    el.innerHTML = h;
  }

  function renderTop() {
    var n = P.tasks.length || 1, c = count(P.tasks);
    var k = [['里程碑', P.milestones.length, ''], ['任务 / Issue', P.tasks.length, ''], [ST.done, c.done, 'done'], [ST.review, c.review, 'review'], [ST.ready, c.ready, 'ready'], [ST.blocked, c.blocked, 'blocked']];
    $('kpis').innerHTML = k.map(function (x) { return '<div class="card kpi"><b>' + x[1] + '</b><span>' + (x[2] ? '<i class="dot d-' + x[2] + '"></i>' : '') + x[0] + '</span></div>'; }).join('');
    var pct = Math.round(c.done / n * 100);
    var waves = P.tasks.reduce(function (m, t) { return Math.max(m, t.wave || 0); }, 0);
    $('overall').innerHTML = '<div class="row"><b>总体进度 ' + pct + '%</b><span class="meta">完成 ' + c.done + ' / ' + P.tasks.length + ' · 待合并 ' + c.review + ' · 进行中 ' + c.doing + ' · 共 ' + waves + ' 个并行批次</span></div>' + progBar(c, n);
    $('mss').innerHTML = P.milestones.map(function (m) {
      var L = P.tasks.filter(function (t) { return t.milestone === m.key; }), cc = count(L);
      return '<button type="button" class="card ms' + (F.ms === m.key ? ' on' : '') + '" data-ms="' + m.key + '"><div class="k">' + esc(m.key) + '</div><div class="t">' + esc(m.title) + '</div>' + progBar(cc, L.length || 1) + '<div class="n">' + cc.done + ' / ' + L.length + ' 完成' + (cc.review ? ' · ' + cc.review + ' 待合并' : '') + '</div></button>';
    }).join('');
    var labels = {}; P.tasks.forEach(function (t) { t.labels.forEach(function (l) { if (!/^priority:/.test(l)) labels[l] = (labels[l] || 0) + 1; }); });
    $('flabel').innerHTML = '<option value="">全部标签</option>' + Object.keys(labels).sort().map(function (l) { return '<option value="' + esc(l) + '"' + (F.label === l ? ' selected' : '') + '>' + esc((LABEL_ZH[l] || l) + '（' + l + '）· ' + labels[l]) + '</option>'; }).join('');
    $('fstate').innerHTML = [['', '全部'], ['done', ST.done], ['review', ST.review], ['doing', ST.doing], ['ready', ST.ready], ['blocked', ST.blocked]].map(function (x) { return '<button type="button" data-st="' + x[0] + '" class="' + (F.state === x[0] ? 'on' : '') + '">' + (x[0] ? '<i class="dot d-' + x[0] + '"></i>' : '') + x[1] + '</button>'; }).join('');
    $('gh').href = GH + '/issues';
    $('src').textContent = P.status_source === 'live' ? '状态：GitHub 实时 · ' + P.live_at : '状态：' + (P.generated_at || '') + ' 快照';
    $('foot').innerHTML = '数据来源：<a href="' + GH + '/blob/main/docs/plan/issues.json" target="_blank" rel="noopener">docs/plan/issues.json</a> 与 <a href="' + GH + '/issues" target="_blank" rel="noopener">GitHub Issues</a>。卫华复用点为卫华平台仓库内的模块路径。快照生成于 ' + esc(P.generated_at || '—') + '。';
  }

  function match(t) {
    if (F.ms && t.milestone !== F.ms) return false;
    if (F.state && status(t) !== F.state) return false;
    if (F.label && t.labels.indexOf(F.label) < 0) return false;
    if (F.prio && t.priority !== F.prio) return false;
    if (F.q) { var s = (t.id + ' #' + t.issue + ' ' + t.title + ' ' + t.goal + ' ' + t.branch + ' ' + t.reuse.map(function (r) { return r.module + ' ' + r.change; }).join(' ')).toLowerCase(); if (s.indexOf(F.q.toLowerCase()) < 0) return false; }
    return true;
  }

  function card(t) {
    var s = status(t);
    var deps = (t.depends_on || []).map(function (d) { var x = byIssue[d.issue]; return '<a href="' + GH + '/issues/' + d.issue + '" target="_blank" rel="noopener" title="' + esc(x ? x.title : d.id) + '"><i class="dot d-' + (x ? status(x) : 'unknown') + '"></i>' + esc(d.id) + ' #' + d.issue + '</a>'; }).join('');
    var reuse = (t.reuse || []).map(function (r) { return '<div><span class="md ' + (MODE[r.mode] || '') + '">' + esc(r.mode) + '</span><span>' + (r.module ? '<code>' + esc(r.module) + '</code>' : '') + '<small>' + esc(r.change) + '</small></span></div>'; }).join('');
    var prs = (t.prs || []).map(function (p) { var st = String(p.state).toUpperCase(); return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"><i class="dot d-' + (st === 'MERGED' ? 'done' : st === 'OPEN' ? 'review' : 'blocked') + '"></i>PR #' + p.number + ' ' + ({ OPEN: '待合并', MERGED: '已合并', CLOSED: '已关闭' }[st] || st) + (st === 'OPEN' && p.ci && p.ci !== 'none' ? ' · CI ' + ({ success: '通过', failure: '失败', pending: '运行中' }[p.ci] || p.ci) : '') + '</a>'; }).join('');
    var L = t.live, runRow = (L && t.state !== 'closed' && (L.executors || []).length) ? '<div class="run">' + ph(L.stuck ? '卡住' : L.phase) + L.executors.map(who).join('') + (L.reviewer ? '<span>评审：' + esc(L.reviewer.name.replace(/^经开区\s*/, '')) + '</span>' : '') + (L.last_activity ? '<span>最近活动 ' + esc(L.last_activity) + '</span>' : '') + (L.stuck ? '<span>' + esc(L.stuck_reason) + '</span>' : '') + '</div>' : '';
    return '<article class="card task s-' + s + (L && L.stuck ? ' stuck' : '') + '">' +
      '<div class="h"><div class="ttl"><span class="tid">' + esc(t.id) + '</span><a href="' + GH + '/issues/' + t.issue + '" target="_blank" rel="noopener">#' + t.issue + '</a> ' + esc(t.title.replace(/^T\d+\s*/, '')) + '</div><span class="st"><i class="dot d-' + s + '"></i>' + ST[s] + '</span></div>' +
      (t.goal ? '<p class="goal">' + esc(t.goal) + '</p>' : '') +
      runRow +
      '<div class="tags">' + t.labels.map(function (l) { return '<span class="tg ' + tagCls(l) + '" title="' + esc(l) + '">' + esc(LABEL_ZH[l] || l.replace(/^priority:/, '')) + '</span>'; }).join('') + '</div>' +
      '<div class="meta"><span>第 ' + (t.wave || '—') + ' 批</span><span class="mono">' + esc(t.branch) + '</span>' + ((t.assignees || []).length ? '<span>负责人 ' + esc(t.assignees.join('、')) + '</span>' : '') + '<span class="deps">' + (deps ? '依赖 ' + deps : '无依赖') + '</span></div>' +
      (prs ? '<div class="prs">' + prs + '</div>' : '') +
      '<details><summary>验收标准（' + t.acceptance.length + ' 条）</summary><ul class="acc">' + t.acceptance.map(function (a) { return '<li><span>' + esc(a).replace(/`([^`]+)`/g, '<code>$1</code>') + '</span></li>'; }).join('') + '</ul></details>' +
      (t.squad_hint ? '<details><summary>小组（jk-squad）拆分建议</summary><p class="goal" style="margin-top:6px">' + esc(t.squad_hint) + '</p></details>' : '') +
      (reuse ? '<details><summary>卫华复用（' + t.reuse.length + ' 处）</summary><div class="reuse">' + reuse + '</div></details>' : '') +
      '</article>';
  }

  function renderList() {
    var shown = 0, html = P.milestones.map(function (m) {
      var L = P.tasks.filter(function (t) { return t.milestone === m.key && match(t); });
      shown += L.length; if (!L.length) return '';
      return '<div class="grp"><span class="k">' + esc(m.key) + '</span><h2>' + esc(m.title) + '</h2><span class="toast">' + L.length + ' 个任务</span><p>' + esc(m.goal) + '</p></div><div class="tasks">' + L.map(card).join('') + '</div>';
    }).join('');
    $('list').innerHTML = html || '<div class="empty">没有符合条件的任务</div>';
    $('cnt').textContent = '显示 ' + shown + ' / ' + P.tasks.length;
  }
  function render() { renderTop(); renderLive(); renderList(); }

  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-ms]'); if (m) { F.ms = F.ms === m.dataset.ms ? '' : m.dataset.ms; render(); return; }
    var s = e.target.closest('[data-st]'); if (s) { F.state = s.dataset.st; render(); }
  });
  $('flabel').onchange = function () { F.label = this.value; renderList(); };
  $('fprio').onchange = function () { F.prio = this.value; renderList(); };
  $('fq').oninput = function () { F.q = this.value.trim(); renderList(); };

  var root = document.documentElement, tb = $('theme');
  function lab() { tb.textContent = root.dataset.theme === 'dark' ? '浅色' : '深色'; }
  lab(); tb.onclick = function () { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('jk4-theme2', root.dataset.theme); } catch (e) {} lab(); };

  // 在线时从 GitHub 公开接口刷新（无需令牌；匿名每小时 60 次，失败就保留快照）
  function live() {
    if (!/^https?:/.test(location.protocol) || !window.fetch) return;
    var b = $('refresh'); b.disabled = true; b.textContent = '刷新中…';
    var api = 'https://api.github.com/repos/' + REPO;
    Promise.all([fetch(api + '/issues?state=all&per_page=100'), fetch(api + '/pulls?state=all&per_page=100')])
      .then(function (r) { if (!r[0].ok || !r[1].ok) throw new Error('http'); return Promise.all([r[0].json(), r[1].json()]); })
      .then(function (d) {
        var iss = {}; d[0].forEach(function (i) { if (!i.pull_request) iss[i.number] = i; });
        var prm = {};
        d[1].forEach(function (p) {
          var refs = {}, re = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#(\d+)/ig, x;
          while ((x = re.exec(p.body || ''))) refs[x[1]] = 1;
          var bm = /^[a-z]+\/(\d+)-/.exec((p.head || {}).ref || ''); if (bm) refs[bm[1]] = 1;
          Object.keys(refs).forEach(function (n) { (prm[n] = prm[n] || []).push({ number: p.number, url: p.html_url, state: p.merged_at ? 'MERGED' : p.state.toUpperCase(), title: p.title }); });
        });
        P.tasks.forEach(function (t) { var i = iss[t.issue]; if (i) { t.state = i.state; t.assignees = (i.assignees || []).map(function (a) { return a.login; }); } var old = {}; (t.prs || []).forEach(function (p) { old[p.number] = p; }); t.prs = (prm[t.issue] || []).map(function (p) { var o = old[p.number]; if (o) { p.ci = o.ci; } return p; }); });
        P.status_source = 'live'; P.live_at = new Date().toLocaleString('zh-CN', { hour12: false, timeZone: 'Asia/Taipei' }) + '（台北）';
        render();
      })
      .catch(function () { $('src').textContent = '实时刷新失败，显示快照 ' + (P.generated_at || ''); })
      .then(function () { b.disabled = false; b.textContent = '刷新状态'; });
  }
  $('refresh').onclick = live;
  render(); live();
})();
</script>
</body>
</html>
